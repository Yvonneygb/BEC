<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购买须知</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"DengXian","等线",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#F8F5FF;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:2rem;
}
.card{
  width:750px;
  background:#fff;
  border-radius:20px;
  padding:2.5rem 2.8rem 2rem;
  box-shadow:0 4px 24px rgba(109,74,255,0.08);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:5px;
  background:linear-gradient(90deg,#6D4AFF,#9B7FFF,#6D4AFF);
}
.header{
  display:flex;align-items:center;gap:.6rem;
  margin-bottom:2rem;
}
.header-icon{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#6D4AFF,#9B7FFF);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;color:#fff;
}
.header h1{
  font-size:1.5rem;font-weight:800;color:#1a1a2e;
  letter-spacing:.02em;
}
.header .sub{
  font-size:.75rem;color:#8E8CA0;margin-top:2px;
}
.notice-list{
  list-style:none;
  display:flex;flex-direction:column;gap:1rem;
}
.notice-item{
  display:flex;align-items:flex-start;gap:1rem;
  padding:1.1rem 1.3rem;
  background:#F8F6FF;
  border-radius:14px;
  border:1px solid rgba(109,74,255,0.1);
  transition:all .2s;
}
.notice-item:hover{
  background:#F0ECFF;
  border-color:rgba(109,74,255,0.2);
}
.notice-num{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#6D4AFF,#9B7FFF);
  color:#fff;font-weight:800;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 3px 10px rgba(109,74,255,0.25);
}
.notice-content h3{
  font-size:.95rem;font-weight:700;color:#1a1a2e;
  margin-bottom:4px;
}
.notice-content p{
  font-size:.8rem;color:#6E6C80;line-height:1.5;
}
.important .notice-num{
  background:linear-gradient(135deg,#E74C3C,#F06252);
  box-shadow:0 3px 10px rgba(231,76,60,0.25);
}
.important{
  background:#FFF5F5;
  border-color:rgba(231,76,60,0.12);
}
.important:hover{
  background:#FFEFEF;
  border-color:rgba(231,76,60,0.25);
}
.footer{
  margin-top:2rem;
  padding-top:1.2rem;
  border-top:1px dashed rgba(0,0,0,0.06);
  text-align:center;
  color:#8E8CA0;
  font-size:.72rem;
}
.footer .brand{
  font-weight:700;color:#6D4AFF;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-icon">📋</div>
    <div>
      <h1>购买须知</h1>
      <div class="sub">下单前请仔细阅读以下说明</div>
    </div>
  </div>

  <ul class="notice-list">
    <li class="notice-item">
      <div class="notice-num">1</div>
      <div class="notice-content">
        <h3>📦 拍下自动发货</h3>
        <p>下单后系统自动发送访问链接，无需等待人工客服。如未收到请检查订单详情页。</p>
      </div>
    </li>
    <li class="notice-item">
      <div class="notice-num">2</div>
      <div class="notice-content">
        <h3>📱 支持多端访问</h3>
        <p>在线网页形式，手机 / PC / 平板均可打开，无需下载任何 App，浏览器即可使用。</p>
      </div>
    </li>
    <li class="notice-item">
      <div class="notice-num">3</div>
      <div class="notice-content">
        <h3>🔄 虚拟资料 · 不退不换</h3>
        <p>本商品为虚拟数字内容，一经发货概不支持退款或换货，请确认需求后再下单。</p>
      </div>
    </li>
    <li class="notice-item important">
      <div class="notice-num">!</div>
      <div class="notice-content">
        <h3>⚖️ 仅供个人学习使用</h3>
        <p>本资料版权归创作者所有，禁止二次售卖、转售、公开传播。违者将追究法律责任。</p>
      </div>
    </li>
  </ul>


</div>
</body>
</html>
