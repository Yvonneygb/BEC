        <meta http-equiv="cache-control" content="no-cache" />

            .staticrypt-hr { display: none; }

                width: 400px;
                padding: 0;
                margin: auto;
                box-sizing: border-box;
            }
            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #FFFFFF;
                max-width: 400px;
                margin: 0 auto;
                padding: 40px 36px;
                text-align: center;
                border-radius: 16px;
                box-shadow: 0 2px 16px rgba(109,74,255,0.06), 0 8px 32px rgba(109,74,255,0.04);
                border: 1px solid #E8E4F2;
            }
            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: #F8F7FC;
                border: 2px solid #E0DCF0;
                border-radius: 10px;
                box-sizing: border-box;
                font-size: 15px;
                outline: 0;
                padding: 14px 44px 14px 16px;
                width: 100%;
                font-family: "DengXian", "等线", -apple-system, "Microsoft YaHei", sans-serif;
                transition: border-color 0.2s;
                color: #1A1A2E;
            }
            .staticrypt-form input[type="password"]:focus,
            input[type="text"]:focus {
                border-color: #6D4AFF;
            }
            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: transparent;
                width: 100%;
                border: 0;
                margin: 0 0 12px;
                box-sizing: border-box;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 50%;
                padding: 13px;
                position: absolute;
                right: 2px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                transition: opacity 0.2s;
            }
            .staticrypt-toggle-password-visibility:hover {
                opacity: 80%;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: linear-gradient(135deg, #6D4AFF, #5B3AE8);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 14px;
                color: #ffffff;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                font-family: "DengXian", "等线", -apple-system, "Microsoft YaHei", sans-serif;
                letter-spacing: 0.5px;
                transition: all 0.2s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: linear-gradient(135deg, #5B3AE8, #4A28D4);
                box-shadow: 0 4px 16px rgba(109,74,255,0.35);
            }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .staticrypt-content {
                height: auto;
                margin-bottom: 0;
                background: linear-gradient(180deg, #F8F7FC 0%, #EDE8FA 100%);
                font-family: "DengXian", "等线", -apple-system, "Microsoft YaHei", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                width: 100%;
            }
            .staticrypt-instructions {
                margin-top: 0;
                margin-bottom: 20px;
            }
            .staticrypt-title {
                font-size: 1.15em;
                font-weight: 700;
                color: #1A1A2E;
                margin: 0 0 6px 0;
                line-height: 1.4;
            }
            .staticrypt-subtitle {
                font-size: 0.85em;
                color: #8E8AA4;
                margin: 0;
            }
            .staticrypt-logo {
                font-size: 36px;
                margin-bottom: 12px;
                display: block;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid #E0DCF0;
                border-right-color: #6D4AFF;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] { font-size: 16px; }
            }
            @media (max-width: 440px) {
                .staticrypt-page { width: 92%; }
                .staticrypt-form { padding: 28px 20px; }
            }
        </style>
